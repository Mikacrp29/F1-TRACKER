[build]
  # INLINE_RUNTIME_CHUNK=false : évite un <script> inline, ce qui permet une CSP stricte (script-src 'self')
  command = "CI=false INLINE_RUNTIME_CHUNK=false npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── En-têtes de sécurité (toutes les pages) ──
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; media-src 'self'; frame-src https://www.tiktok.com https://www.instagram.com; connect-src 'self' https://api.jolpi.ca; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── Cache : fichiers hashés = 1 an, le reste = revalidation ──
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/paddock/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/intro/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
